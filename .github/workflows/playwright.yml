name: Playwright Tests with Allure Report

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  pull-requests: write
  checks: write

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout source code ──────────────────────────────────────────
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ── 2. Node setup ────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      # ── 3. Install dependencies ──────────────────────────────────────────
      - name: Install Dependencies
        run: npm ci

      # ── 4. Install Playwright browsers ──────────────────────────────────
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # ── 5. Run tests (always continue so reports are still generated) ────
      - name: Run Playwright Tests
        run: npx playwright test
        continue-on-error: true

      # ── 6. Ensure allure-results directory exists ────────────────────────
      - name: Ensure allure-results directory exists
        if: always()
        run: mkdir -p allure-results

      # ── 7. Pull previous Allure history from gh-pages ───────────────────
      - name: Get Allure history
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      # ── 8. Generate Allure HTML report ──────────────────────────────────
      - name: Generate Allure Report
        uses: simple-elf/allure-report-action@master
        if: always()
        with:
          allure_results: allure-results
          gh_pages: gh-pages
          allure_report: allure-report
          allure_history: allure-history
          keep_reports: 20

      # ── 9. Deploy Allure report to GitHub Pages (gh-pages branch) ────────
      - name: Deploy Allure Report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
          keep_files: true

      # ── 10. Upload Playwright HTML report as artifact ────────────────────
      - name: Upload Playwright HTML Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-html-report
          path: playwright-report/
          retention-days: 30

      # ── 11. Upload raw Allure results as artifact ────────────────────────
      - name: Upload Allure Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: allure-results/
          retention-days: 30
