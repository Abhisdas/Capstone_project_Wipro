name: Playwright Tests with Allure Report

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test-and-report:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout source ────────────────────────────────────────────────
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ── 2. Setup Node ─────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── 3. Setup Java (required by Allure CLI) ────────────────────────────
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ── 4. Install Allure CLI ─────────────────────────────────────────────
      - name: Install Allure CLI
        run: |
          npm install -g allure-commandline --save-dev
          allure --version

      # ── 5. Install project dependencies ───────────────────────────────────
      - name: Install Dependencies
        run: npm ci

      # ── 6. Install Playwright browsers ────────────────────────────────────
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      # ── 7. Run Playwright tests ────────────────────────────────────────────
      - name: Run Playwright Tests
        run: npx playwright test --project=chromium
        continue-on-error: true
        env:
          CI: true

      # ── 8. Debug – list what was generated ────────────────────────────────
      - name: List allure-results
        if: always()
        run: |
          echo "=== allure-results contents ==="
          ls -la allure-results/ || echo "allure-results directory is EMPTY or missing"
          echo "=== Total files ==="
          find allure-results -name "*.json" 2>/dev/null | wc -l || echo "0"

      # ── 9. Restore Allure history from gh-pages ────────────────────────────
      - name: Restore Allure history from gh-pages
        if: always()
        run: |
          git fetch origin gh-pages --depth=1 2>/dev/null || echo "gh-pages branch does not exist yet"
          if git show-ref --quiet refs/remotes/origin/gh-pages; then
            mkdir -p gh-pages
            git archive origin/gh-pages | tar -x -C gh-pages
            echo "✅ History restored from gh-pages"
            ls gh-pages/ || true
          else
            echo "ℹ️ No gh-pages branch yet - first run"
          fi

      # ── 10. Generate Allure HTML report ───────────────────────────────────
      - name: Generate Allure Report
        if: always()
        run: |
          mkdir -p allure-results
          # Copy history from previous deployment if it exists
          if [ -d "gh-pages/history" ]; then
            cp -r gh-pages/history allure-results/history
            echo "✅ Copied history for trend data"
          fi
          allure generate allure-results --clean -o allure-report
          echo "✅ Allure report generated"
          ls -la allure-report/

      # ── 11. Prepare gh-pages deployment directory ─────────────────────────
      - name: Prepare deployment
        if: always()
        run: |
          # Create a numbered subdirectory for this run's report
          RUN_NUMBER=${{ github.run_number }}
          mkdir -p deploy/$RUN_NUMBER
          cp -r allure-report/. deploy/$RUN_NUMBER/

          # Copy latest report to root so the base URL shows the latest
          cp -r allure-report/. deploy/

          # Preserve old run reports if gh-pages exists
          if [ -d "gh-pages" ]; then
            # Keep up to 20 previous numbered runs
            for dir in gh-pages/[0-9]*/; do
              run_dir=$(basename "$dir")
              if [ "$run_dir" != "$RUN_NUMBER" ]; then
                cp -r "gh-pages/$run_dir" "deploy/$run_dir" 2>/dev/null || true
              fi
            done
          fi

          echo "✅ Deploy directory contents:"
          ls -la deploy/

      # ── 12. Deploy to GitHub Pages ────────────────────────────────────────
      - name: Deploy to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: deploy
          force_orphan: false
          keep_files: false
          commit_message: 'ci: deploy Allure report for run #${{ github.run_number }}'

      # ── 13. Upload Playwright HTML report artifact ────────────────────────
      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-run-${{ github.run_number }}
          path: playwright-report/
          retention-days: 30

      # ── 14. Upload Allure results artifact ───────────────────────────────
      - name: Upload Allure Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-run-${{ github.run_number }}
          path: allure-results/
          retention-days: 30

      # ── 15. Upload Allure HTML report artifact ────────────────────────────
      - name: Upload Allure Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report-run-${{ github.run_number }}
          path: allure-report/
          retention-days: 30
