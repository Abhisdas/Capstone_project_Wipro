name: Playwright Tests with Allure Report

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Install Dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run Playwright Tests (chromium, firefox, webkit)
      run: npx playwright test
      continue-on-error: true

    - name: Install Allure CLI
      if: always()
      run: npm install -g allure-commandline --save-dev

    - name: Restore previous Allure history
      if: always()
      run: |
        if git ls-remote --heads origin gh-pages | grep gh-pages; then
          git fetch origin gh-pages --depth=1
          git checkout origin/gh-pages -- allure-history || true
        fi
      continue-on-error: true

    - name: Generate Allure Report
      if: always()
      run: |
        if [ -d "allure-history/last-history" ]; then
          cp -r allure-history/last-history allure-results/history
        fi
        allure generate allure-results --clean -o allure-report
        mkdir -p allure-history
        cp -r allure-report allure-history/last-report
        cp -r allure-report/history allure-history/last-history || true

    - name: Deploy Allure Report to GitHub Pages
      if: always()
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        branch: gh-pages
        folder: allure-report
        token: ${{ secrets.GITHUB_TOKEN }}
        clean: false

    - name: Upload Playwright HTML Report
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-html-report
        path: playwright-report/
        retention-days: 30

    - name: Upload Allure Results
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: allure-results
        path: allure-results/
        retention-days: 30
