name: Playwright Tests with Allure Report

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test-and-report:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout source ────────────────────────────────────────────────
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ── 2. Setup Node ─────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── 3. Setup Java (required by Allure CLI) ────────────────────────────
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ── 4. Install Allure CLI ─────────────────────────────────────────────
      - name: Install Allure CLI
        run: |
          npm install -g allure-commandline
          allure --version

      # ── 5. Install project dependencies ───────────────────────────────────
      - name: Install Dependencies
        run: npm ci

      # ── 6. Install Playwright browsers ────────────────────────────────────
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      # ── 7. Clean up any stale allure-results ──────────────────────────────
      - name: Clean allure-results
        run: rm -rf allure-results && mkdir -p allure-results

      # ── 8. Run Playwright tests ────────────────────────────────────────────
      - name: Run Playwright Tests
        id: run_tests
        run: |
          npx playwright test --project=chromium 2>&1 | tee test-output.log
          TEST_EXIT_CODE=${PIPESTATUS[0]}
          echo "test_exit_code=$TEST_EXIT_CODE" >> $GITHUB_OUTPUT
          echo "Tests completed with exit code: $TEST_EXIT_CODE"
          # Don't fail here so we can still generate reports
          exit 0
        env:
          CI: true

      # ── 9. Debug – verify allure-results were generated ───────────────────
      - name: Verify allure-results
        if: always()
        run: |
          echo "=== allure-results directory ==="
          ls -la allure-results/ 2>/dev/null || echo "Directory missing!"
          echo ""
          echo "=== JSON result files count ==="
          RESULT_COUNT=$(find allure-results -name "*-result.json" 2>/dev/null | wc -l)
          echo "Found $RESULT_COUNT result files"
          echo ""
          echo "=== Container files count ==="
          CONTAINER_COUNT=$(find allure-results -name "*-container.json" 2>/dev/null | wc -l)
          echo "Found $CONTAINER_COUNT container files"
          echo ""
          if [ "$RESULT_COUNT" -eq 0 ]; then
            echo "⚠️ WARNING: No allure result files found!"
            echo "=== Test output log (last 50 lines) ==="
            tail -50 test-output.log 2>/dev/null || echo "No test output log"
            echo ""
            echo "=== Checking if allure-playwright is properly installed ==="
            node -e "try { require.resolve('allure-playwright'); console.log('✅ allure-playwright found'); } catch(e) { console.log('❌ allure-playwright NOT found:', e.message); }"
            echo ""
            echo "=== Current playwright.config.js reporter section ==="
            grep -A 10 'reporter' playwright.config.js || true
          else
            echo "✅ Found $RESULT_COUNT test result files"
            echo "=== Sample result file ==="
            head -c 500 allure-results/*-result.json 2>/dev/null | head -5 || true
          fi

      # ── 10. Restore Allure history from gh-pages ──────────────────────────
      - name: Restore Allure history
        if: always()
        run: |
          git fetch origin gh-pages --depth=1 2>/dev/null || echo "No gh-pages branch yet"
          if git show-ref --quiet refs/remotes/origin/gh-pages; then
            mkdir -p allure-history-prev
            git archive origin/gh-pages | tar -x -C allure-history-prev 2>/dev/null || true
            # Copy history folder to allure-results for trend data
            if [ -d "allure-history-prev/history" ]; then
              cp -r allure-history-prev/history allure-results/history
              echo "✅ Copied history for trend graphs"
            fi
          fi

      # ── 11. Generate Allure HTML report ───────────────────────────────────
      - name: Generate Allure Report
        if: always()
        run: |
          echo "=== Generating Allure report ==="
          allure generate allure-results --clean -o allure-report
          echo ""
          echo "=== Generated report structure ==="
          ls -la allure-report/
          echo ""
          echo "=== Report summary ==="
          cat allure-report/widgets/summary.json 2>/dev/null || echo "No summary"

      # ── 12. Deploy to GitHub Pages ────────────────────────────────────────
      - name: Deploy to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
          keep_files: false
          commit_message: 'deploy: allure report for run #${{ github.run_number }}'

      # ── 13. Upload artifacts ──────────────────────────────────────────────
      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload Allure Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: allure-results/
          retention-days: 30

      - name: Upload Test Output Log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-output-log
          path: test-output.log
          retention-days: 30

      # ── 14. Report final status ───────────────────────────────────────────
      - name: Report Status
        if: always()
        run: |
          RESULT_COUNT=$(find allure-results -name "*-result.json" 2>/dev/null | wc -l)
          if [ "$RESULT_COUNT" -gt 0 ]; then
            echo "✅ Successfully generated Allure report with $RESULT_COUNT test results"
          else
            echo "❌ Allure report was generated but contains 0 test results"
            echo "Check the 'Verify allure-results' step and 'test-output-log' artifact for details"
          fi
